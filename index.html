<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAGASA Guimba Youth Organization</title>
    <meta name="description" content="Comprehensive Management Information System & Public Portal for PAGASA Guimba Youth Organization featuring member management, QR attendance tracking, events, projects, certificates, announcements, and reporting." />
    <meta property="og:title" content="PAGASA Guimba Youth Organization" />
    <meta property="og:description" content="Comprehensive Management Information System & Public Portal for PAGASA Guimba Youth Organization featuring member management, QR attendance tracking, events, projects, certificates, announcements, and reporting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./pagasa-logo.svg" />
    <link rel="apple-touch-icon" href="./pagasa-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #2563eb; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); margin-bottom: 20px;">
          P
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #0f172a;">PAGASA Guimba Youth MIS</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 24px 0; max-width: 320px;">Loading youth management portal...</p>
        <div style="width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      // Global fallback in case bundle download fails
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.querySelector('.emergency-fallback') === null && document.querySelector('.min-h-screen') === null) {
          console.error('Page load error:', e);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
